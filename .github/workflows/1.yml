name: 构建 OpenList Magisk 模块 (Lite)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'update.json'
      - 'OpenList-Magisk/module.prop'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                      # 完整历史，避免定时触发时 push 异常
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip gh

      - name: 获取 OpenList 最新版本
        id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: https://api.github.com/repos/OpenListTeam/OpenList/releases/latest
        run: |
          for i in {1..3}; do
            RESPONSE=$(curl -s -L -w "\n%{http_code}" \
              -H "Authorization: Bearer $GITHUB_TOKEN" "$API_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" -eq 200 ] && [ -n "$BODY" ]; then
              echo "成功获取 OpenList Release 数据"
              echo "$BODY" > latest_release.json
              break
            fi
            echo "尝试 $i 失败，HTTP 状态码: $HTTP_CODE"
            sleep $((5 * i))
          done

          if [ ! -s latest_release.json ]; then
            echo "::error::无法获取 OpenList 版本信息"
            exit 1
          fi

          VERSION=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d['tag_name'])" < latest_release.json)
          if [ -z "$VERSION" ]; then
            echo "::error::无法提取版本号"
            exit 1
          fi

          VERSION_NUM=$(echo "$VERSION" | tr -d 'v')
          VERSION_CODE=$(echo "$VERSION_NUM" | awk -F. '{print $1*1000 + $2*100 + $3}')

          ARM_URL=$(python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for a in d.get('assets',[]):
              if 'openlist-android-arm-lite.tar.gz' in a['name']:
                  print(a['browser_download_url']); break
          " < latest_release.json)

          ARM64_URL=$(python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for a in d.get('assets',[]):
              if 'openlist-android-arm64-lite.tar.gz' in a['name']:
                  print(a['browser_download_url']); break
          " < latest_release.json)

          if [ -z "$ARM_URL" ] || [ -z "$ARM64_URL" ]; then
            echo "::error::无法提取 Lite 版本下载链接"
            exit 1
          fi

          # ── CHANGELOG 写入文件，绝不嵌入 shell 脚本 ──────────────
          python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d.get('body',''))
          " < latest_release.json > /tmp/changelog.md

          {
            echo "OPENLIST_VERSION=$VERSION"
            echo "OPENLIST_VERSION_CODE=$VERSION_CODE"
            echo "OPENLIST_ARM_URL=$ARM_URL"
            echo "OPENLIST_ARM64_URL=$ARM64_URL"
          } >> "$GITHUB_ENV"

      - name: 检查当前模块版本
        id: check_version
        run: |
          if [ -f update.json ]; then
            CURRENT_VERSION=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('version','none'))" < update.json)
          else
            CURRENT_VERSION=none
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"

      - name: 检查是否需要构建
        id: should_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_MATCH=false
          if [ "${{ env.CURRENT_VERSION }}" != "none" ] && \
             [ "${{ env.OPENLIST_VERSION }}" = "${{ env.CURRENT_VERSION }}" ]; then
            VERSION_MATCH=true
          fi

          RELEASE_EXISTS=false
          if [ "$VERSION_MATCH" = "true" ]; then
            if gh release view "${{ env.OPENLIST_VERSION }}" &>/dev/null; then
              RELEASE_EXISTS=true
            fi
          fi

          if [ "${{ env.CURRENT_VERSION }}" = "none" ] || \
             [ "${{ env.OPENLIST_VERSION }}" != "${{ env.CURRENT_VERSION }}" ] || \
             [ "$RELEASE_EXISTS" = "false" ]; then
            echo "需要构建新模块"
            echo "SHOULD_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "已是最新版本 (${{ env.OPENLIST_VERSION }})，无需构建"
            echo "SHOULD_BUILD=false" >> "$GITHUB_ENV"
          fi

      - name: 同步 OpenList 二进制文件
        if: env.SHOULD_BUILD == 'true'
        run: |
          download_and_extract() {
            local url=$1 output=$2 archive="${2}.tar.gz"
            for i in {1..3}; do
              if curl -fL -o "$archive" "$url"; then break; fi
              echo "下载失败，重试 $i/3"; sleep $((5 * i))
            done
            [ -f "$archive" ] || { echo "::error::下载失败: $url"; exit 1; }
            tar -xzf "$archive"
            [ -f openlist ] || { echo "::error::解压失败: $archive"; exit 1; }
            mv openlist "$output"
            rm -f "$archive"
          }

          download_and_extract "${{ env.OPENLIST_ARM_URL }}"   openlist-arm
          download_and_extract "${{ env.OPENLIST_ARM64_URL }}" openlist-arm64

          mv openlist-arm   OpenList-Magisk/
          mv openlist-arm64 OpenList-Magisk/
          chmod 755 OpenList-Magisk/openlist-arm OpenList-Magisk/openlist-arm64

      - name: 更新配置文件
        if: env.SHOULD_BUILD == 'true'
        run: |
          # ── update.json：用 python 写，避免特殊字符问题 ──────────
          python3 - << 'PYEOF'
          import json, os
          data = {
              "version": os.environ["OPENLIST_VERSION"],
              "versionCode": int(os.environ["OPENLIST_VERSION_CODE"]),
              "zipUrl": (
                  f"{os.environ['GITHUB_SERVER_URL']}"
                  f"/{os.environ['GITHUB_REPOSITORY']}"
                  f"/releases/download/{os.environ['OPENLIST_VERSION']}"
                  f"/openlist-magisk-lite-{os.environ['OPENLIST_VERSION']}.zip"
              ),
              "changelog": (
                  f"{os.environ['GITHUB_SERVER_URL']}"
                  f"/{os.environ['GITHUB_REPOSITORY']}"
                  f"/raw/main/OpenList-Magisk/CHANGELOG.md"
              ),
          }
          with open("update.json", "w") as f:
              json.dump(data, f, indent=4)
          print("update.json 已写入")
          PYEOF

          # ── module.prop ────────────────────────────────────────────
          if [ ! -f OpenList-Magisk/module.prop ]; then
            echo "::error::module.prop 不存在"
            exit 1
          fi
          sed -i "s/^version=.*/version=${{ env.OPENLIST_VERSION }}/" OpenList-Magisk/module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ env.OPENLIST_VERSION_CODE }}/" OpenList-Magisk/module.prop

          # ── CHANGELOG：从临时文件复制，不经过 shell 变量 ──────────
          cp /tmp/changelog.md OpenList-Magisk/CHANGELOG.md

          # ── git 提交 ───────────────────────────────────────────────
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add update.json OpenList-Magisk/module.prop OpenList-Magisk/CHANGELOG.md
          git commit -m "更新模块到 OpenList Lite ${{ env.OPENLIST_VERSION }}" || echo "无更改需要提交"
          git push origin main

      - name: 打包模块
        if: env.SHOULD_BUILD == 'true'
        run: |
          zip -r "openlist-magisk-lite-${{ env.OPENLIST_VERSION }}.zip" OpenList-Magisk/

      - name: 创建 Release
        if: env.SHOULD_BUILD == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ env.OPENLIST_VERSION }}" &>/dev/null; then
            echo "Release ${{ env.OPENLIST_VERSION }} 已存在，跳过"
            exit 0
          fi

          # Release notes 从文件读取，不经过 shell 变量
          {
            echo "Synced with OpenList official Lite release ${{ env.OPENLIST_VERSION }}"
            echo ""
            cat /tmp/changelog.md
          } > release_notes.txt

          gh release create "${{ env.OPENLIST_VERSION }}" \
            --title "OpenList Magisk Module Lite ${{ env.OPENLIST_VERSION }}" \
            --notes-file release_notes.txt \
            --draft=false \
            --prerelease=false \
            "openlist-magisk-lite-${{ env.OPENLIST_VERSION }}.zip"

          echo "Release ${{ env.OPENLIST_VERSION }} 创建成功"

      - name: 清理临时文件
        if: always()
        run: |
          rm -f openlist-magisk-*.zip latest_release.json release_notes.txt /tmp/changelog.md
